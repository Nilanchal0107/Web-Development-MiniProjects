<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Metric / Imperial Unit Conversion</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="card">
        <!-- Top Section -->
        <div class="top">
            <h1>Metric/Imperial Unit Conversion</h1>

            <input type="text" id="number-box">

            <button id="convert-btn">Convert</button>
        </div>

        <!-- Bottom Section -->
        <div class="bottom">

            <div class="box">
                <h2>Length (Meter/Feet)</h2>
                <p id="Length">1 meters = 3.218 feet | 1 feet = 0.305 meters</p>
            </div>

            <div class="box">
                <h2>Volume (Liters/Gallons)</h2>
                <p id="Volume">1 liters = 0.264 gallons | 1 gallons = 3.785 liters</p>
            </div>

            <div class="box">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p id="Mass">1 kilos = 2.205 pounds | 1 pounds = 0.454 kilos</p>
            </div>

        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
